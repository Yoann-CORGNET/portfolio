sonar.projectKey=Yoann-CORGNET_portfolio
sonar.organization=yoann-corgnet

# The key is globally unique on SonarQube Cloud, hence the owner prefix. The
# display name is not, so it can be the plain repo name.
sonar.projectName=portfolio

sonar.sources=src

# ESLint findings are imported so both tools report on one dashboard instead
# of two. Generated by `pnpm run lint:report`.
sonar.eslint.reportPaths=eslint-report.json

# The site has no test suite, so no coverage report exists and Sonar counts
# every new line as uncovered, failing the "Sonar way" gate (custom gates need
# a paid plan). Excluding everything leaves the coverage condition nothing to
# measure; the rest of the analysis is untouched. Narrow this to the files to
# exclude, and wire an lcov report, once tests are added.
sonar.coverage.exclusions=**/*
