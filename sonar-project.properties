sonar.projectKey=Yoann-CORGNET_portfolio
sonar.organization=yoann-corgnet

# The key is globally unique on SonarQube Cloud, hence the owner prefix. The
# display name is not, so it can be the plain repo name.
sonar.projectName=portfolio

sonar.sources=src

# ESLint findings are imported so both tools report on one dashboard instead
# of two. Generated by `pnpm run lint:report`.
sonar.eslint.reportPaths=eslint-report.json
